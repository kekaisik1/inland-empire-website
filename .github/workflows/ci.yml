name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: mysite.settings.dev
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Compile translations
        run: python scripts/compile_translations.py

      - name: Django system check
        run: python manage.py check

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --verbosity 1

      - name: Build Tailwind CSS deterministically
        shell: bash
        run: |
          before="$(sha256sum mysite/static/css/output.css | cut -d ' ' -f 1)"
          npm run build:css
          after="$(sha256sum mysite/static/css/output.css | cut -d ' ' -f 1)"
          test "$before" = "$after"

      - name: Verify deployment contract
        run: python scripts/verify_deployment_contract.py
